<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Compass Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.3" />
    </linearGradient>

    <!-- Needle North Facet 1 (Light Cyan) -->
    <linearGradient id="needleNorthLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Needle North Facet 2 (Vibrant Blue) -->
    <linearGradient id="needleNorthDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Needle South Facet 1 (Soft White/Slate) -->
    <linearGradient id="needleSouthLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Needle South Facet 2 (Muted Steel) -->
    <linearGradient id="needleSouthDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Star Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Ambient Glow Ring -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="6 8" opacity="0.6" />
  
  <!-- Outer Solid Compass Rim -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Orbiting Career Pathway Arc -->
  <path d="M 120 280 C 130 180, 220 120, 340 130" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <path d="M 390 230 C 380 330, 290 390, 170 380" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Cardinal Direction Marker Ticks -->
  <!-- North -->
  <line x1="256" y1="102" x2="256" y2="120" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  <!-- South -->
  <line x1="256" y1="392" x2="256" y2="410" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <!-- East -->
  <line x1="410" y1="256" x2="392" y2="256" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  <!-- West -->
  <line x1="102" y1="256" x2="120" y2="256" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Diagonal Sub-ticks -->
  <circle cx="350" cy="162" r="3" fill="#FFFFFF" opacity="0.5" />
  <circle cx="162" cy="350" r="3" fill="#FFFFFF" opacity="0.3" />
  <circle cx="350" cy="350" r="3" fill="#FFFFFF" opacity="0.3" />
  <circle cx="162" cy="162" r="3" fill="#FFFFFF" opacity="0.5" />

  <!-- Compass Needle Group Rotated toward North-East (Aspiration Direction) -->
  <g transform="rotate(45, 256, 256)">
    <!-- North Pointer (Pointing Upward in local coords) -->
    <!-- Left Facet (Brighter Cyan) -->
    <polygon points="256,256 226,256 256,90" fill="url(#needleNorthLight)" />
    <!-- Right Facet (Deep Blue) -->
    <polygon points="256,256 286,256 256,90" fill="url(#needleNorthDark)" />

    <!-- South Pointer (Tail) -->
    <!-- Left Facet (Light Steel) -->
    <polygon points="256,256 226,256 256,380" fill="url(#needleSouthLight)" />
    <!-- Right Facet (Muted Steel) -->
    <polygon points="256,256 286,256 256,380" fill="url(#needleSouthDark)" />

    <!-- Center Pivot Hardware -->
    <circle cx="256" cy="256" r="28" fill="#0F172A" opacity="0.3" />
    <circle cx="256" cy="256" r="22" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="12" fill="#0284C7" />
    <circle cx="256" cy="256" r="5" fill="#FFFFFF" />
  </g>

  <!-- Guiding North Star (Fixed near North-East target) -->
  <g transform="translate(356, 156)" filter="url(#glow)">
    <path d="M 0,-26 Q 2,-4 22,-0 Q 2,4 0,26 Q -2,4 -22,0 Q -2,-4 0,-26 Z" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="4" fill="#38BDF8" />
  </g>
</svg>
